# 并行策略
parallel:
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules: # 如果要开prefetch的话，请不要随意修改apply_modules的顺序
      - model.embed_tokens
      - model
      - model.layers.{*}
      - model.layers.{*}.linear_attn
      - model.layers.{*}.mlp.experts
      - lm_head
      - mtp
    hook_modules:
      - model.layers.{*}
    param_dtype: bf16
    reduce_dtype: fp32
    num_to_forward_prefetch: 1
    num_to_backward_prefetch: 1
  ulysses_parallel_size: 1 # 开启 ulysses-cp 时, 请将 model 的 attn_implementation 设置为 flash_attention_2
  expert_parallel_size: 1
  ep_plan:
    apply_modules:
      - model.layers.{*}.mlp.experts
    dispatcher: alltoall

### 数据相关配置
data:
  dataset_param: &TRAIN_DATASET_PARAM
    dataset_type: huggingface
    #数据集属性
    attr:
      messages: messages
      role_tag: role
      content_tag: content
      user_tag: user
      assistant_tag: assistant

    # 数据预处理
    preprocess_parameters:
      model_name_or_path: &HF_MODEL_LOAD_PATH ./ckpt/hf_path/Qwen38-xxB # 替换为原始hf权重
      use_fast_tokenizer: true
      split_special_tokens: false

    basic_parameters: &TRAIN_BASIC_PARAMETERS
      cutoff_len: 1024
      template: qwen3_6_nothink
      enable_thinking: false
      train_on_prompt: false
      mask_history: false
      dataset_dir: ./data/
      dataset: &DATASET_PATH ./data/xxx_data_train.json
      cache_dir: ./cache_dir/
      overwrite_cache: false
      preprocess_on_fly: true
      preprocessing_batch_size: 1000
      preprocessing_num_workers: 16
      max_samples: null

  val_dataset_param:
    <<: *TRAIN_DATASET_PARAM
    basic_parameters:
      <<: *TRAIN_BASIC_PARAMETERS
      dataset: ./data/mllm_format_llava_instruct_data_val.json
      cache_dir: ./cache_dir/val

  # 数据加载
  dataloader_param:
    pin_memory: true
    shuffle: true
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 8
    collate_param:
      model_name: qwen3vl
      ignore_pad_token_for_loss: true
    enable_preload: true

# 模型配置
model:
  model_id: qwen3_8_moe
  model_name_or_path: *HF_MODEL_LOAD_PATH
  trust_remote_code: true
  attn_implementation: flash_attention_2
  # 融合算子配置
  gdn_implementation: ascendc
  causal_conv1d_implementation: ascendc
  use_grouped_expert_matmul: true
  # skip_recompute
  skip_gdn_recompute: true
  skip_flash_attn_recompute: true

# 优化特性配置
features:
  # loss 配置
  loss_cfg:
    loss_type: default   # If you want raw loss in model, loss_type can be set to "raw".
    router_aux_loss_coef: 0.0
  # 重计算配置
  recompute: true
  recompute_plan:
      apply_modules:
        - model.layers.{*}
  # chunkloss配置
  enable_chunk_loss: true
  chunkloss_plan:
    apply_module: lm_head
    chunk_size: 512
  # activation offload 配置
  enable_activation_offload: true
  activation_offload_plan:
    apply_modules:
     - model.layers.{*}
  # chunkmbs配置
  enable_chunk_mbs: true
  chunkmbs_plan:
    apply_modules:
     - model.layers.{*}
    chunk_mbs: 1 # 这个表示的是chunk之后的micro batchsize
    batch_dim: 0
    chunk_arg_indexs: [0]
    chunk_kwarg_names: ["position_embeddings", "position_ids", "rope_deltas", "attention_mask"]

  # ep balance
  enable_ep_balance: false
  ep_balance_plan:
    max_dup_experts_num: 2

# 训练配置
training:
  micro_batch_size: 2
  gradient_accumulation_steps: 1
  seed: 42
  lr: 1.0e-5
  lr_decay_style: cosine
  lr_warmup_ratio: 0.1
  weight_decay: 0
  train_iters: 100
  val_interval: 0
  val_micro_batch_size: 1
  clip_grad: 0.0
  init_model_with_meta_device: true
  optimizer: adamw
  adam_fused: true
  save_interval: 10000
  no_load_optim: true  # Do not load optimizer state; remove if loading is needed.
  no_load_rng: true  # Do not load RNG state; remove if loading is needed.
  no_save_optim: true  # Do not save optimizer state; remove if saving is needed.
  no_save_rng: true  # Do not save RNG state; remove if saving is needed.
  # load: ./ckpt/hf_path/Qwen38-xxB  # 根据load_format替换为hf权重或转换后的dcp权重路径
  # load_format: auto  # 设置为auto时根据加载文件格式自动判断是hf权重还是dcp权重
  # save: ./save_path
  # save_format: dcp
  use_deter_comp: false
  plugin:
    - mindspeed_mm/fsdp/models/qwen3_5_moe
    - mindspeed_mm/fsdp/data/datasets/huggingface

# 工具配置
tools:
  profile:
    enable: false
    profile_type: static
    ranks: [0]
    static_param:
      level: level1
      with_stack: true
      with_memory: true
      record_shapes: true
      with_cpu: true
      save_path: ./profiling
      start_step: 29
      end_step: 32
      data_simplification: false
      aic_metrics_type: PipeUtilization
  memory_profile:
      enable: false
      start_step: 1
      end_step: 2
      save_path: ./memory_snapshot
      dump_ranks: [0]
      stacks: all
      max_entries: null
      mem_info: false
