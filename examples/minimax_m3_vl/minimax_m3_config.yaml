parallel:
  tensor_parallel_size: 1
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules:
      - model.vision_tower.layers.{*}
      - model.multi_modal_projector
      - model.language_model.embed_tokens
      - model.language_model.layers.{*}
      - model.language_model.layers.{*}.mlp.experts
      - model.language_model.norm
      - lm_head
    hook_modules:
      - model.language_model.layers.{*}
    param_dtype: bf16
    reduce_dtype: fp32
    num_to_forward_prefetch: 1
    num_to_backward_prefetch: 1
  ring_attention_size: 1
  ulysses_parallel_size: 1
  expert_parallel_size: 4
  ep_plan:
    apply_modules:
      - model.language_model.layers.{*}.mlp.experts
    dispatcher: alltoall

data:
  dataset_param:
    dataset_type: huggingface
    attr:
      images: images
      messages: messages
      role_tag: role
      content_tag: content
      user_tag: user
      assistant_tag: assistant
    preprocess_parameters:
      model_name_or_path: /path/to/MiniMax-M3
      trust_remote_code: true
      use_fast_tokenizer: true
      split_special_tokens: false
      image_max_pixels: 16384
      image_min_pixels: 3136
      video_max_pixels: 16384
      video_min_pixels: 0
      video_fps: 1.0
      video_maxlen: 8
    basic_parameters:
      cutoff_len: 768
      template: minimax_m3_vl
      train_on_prompt: false
      mask_history: false
      dataset_dir: ./data/COCO2017
      dataset: &DATASET_PATH ./data/COCO2017/mllm_format_llava_instruct_data.json
      cache_dir: ./cache_dir/minimax_m3_vl
      overwrite_cache: true
      preprocessing_batch_size: 8
      preprocessing_num_workers: null
      max_samples: 64
  dataloader_param:
    pin_memory: true
    shuffle: true
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 4
    collate_param:
      collator_id: qwen3vl
      ignore_pad_token_for_loss: true
      pad_to_multiple_of: 8
    enable_preload: true

model:
  model_id: minimax_m3_vl
  model_name_or_path: &MODEL_PATH /path/to/MiniMax-M3
  trust_remote_code: true
  attn_implementation: flash_attention_2
  freeze:
    - model.vision_tower

features:
  loss_cfg:
    loss_type: default
    router_aux_loss_coef: 0.0
  recompute: true
  recompute_plan:
    apply_modules:
      - model.vision_tower.layers.{*}
      - model.language_model.layers.{*}
  enable_chunk_loss: true
  chunkloss_plan:
    apply_module: lm_head
    chunk_size: 1024
  enable_activation_offload: false
  enable_chunk_mbs: false

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  seed: 42
  lr: 1.0e-5
  lr_decay_style: cosine
  lr_warmup_ratio: 0.0
  weight_decay: 0.0
  train_iters: 10
  clip_grad: 1.0
  init_model_with_meta_device: true
  optimizer: adamw
  adam_fused: true
  save_interval: 1000
  save: ""
  load: "/path/to/MiniMax-M3-dcp"
  load_format: dcp
  load_rank0_and_broadcast: false
  log_interval: 1
  use_deter_comp: false
  plugin:
    - mindspeed_mm/fsdp/models/minimax_m3_vl
    - mindspeed_mm/fsdp/data/datasets/huggingface
