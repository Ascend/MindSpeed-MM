name: PR-pipeline_MindSpeed-MM

concurrency:
  enable: true
  max: 3
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

on:
  pull_request_comment:
    types: [created]
    branches: [ 'master', '26.1.0' ]
    comments: [ '^compile$' ]

env:
  TARGET_BRANCH: ${{ atomgit.base_ref || 'master' }}
  pr_id: ${{ atomgit.event.pull_request.number || atomgit.event.issue.number || '0' }}

stages:
  stage1:
    name: CodeCheck
    select: selected_by_default
    jobs:
      CodeCheck_pre_commit:
        name: CodeCheck_pre_commit
        runs-on: [ self-hosted, x86, cpu=32 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/mindspore/mindspore_python3.11:v0.1
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
          - name: setup-python310
            uses: setup-python
            with:
              python-version: "3.10.20"
          - name: install gitleaks
            run: |
              cd ${ATOMGIT_WORKSPACE}
              wget --no-host-directories -c --no-check-certificate https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta-codecheck/gitleaks
              chmod +x gitleaks
              cd -
          - name: pre-commit
            uses: openlibing-pre-commit-action

      Detect_file_changes:
        name: Detect_file_changes
        runs-on: [ self-hosted, x86, cpu=32 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
        outputs:
          need_build_ut: ${{ steps.set-skip.outputs.need_build_ut }}
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              fetch-depth: 0
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: 'pull_request'
              base: ${{ atomgit.event.pull_request.base.ref }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.pr_id }}
              token: ${{ atomgit.ATOMGIT_TOKEN }}
              list-files: json
              predicate-quantifier: every
              filters: |
                changed:
                  - '**'
                non-doc:
                  - '!**/*.md'
                  - '!**/*.rst'
                  - '!**/*.log'
                  - '!**/*.png'
                  - '!**/*.jpg'
                  - '!**/*.doc'
                  - '!**/*.eddx'
                  - '!**/*.svg'

          - name: set build skip flag
            id: set-skip
            run: |
              echo "changed: ${{ steps.filter.outputs.changed_files }}"
              echo "non-doc: ${{ steps.filter.outputs.non-doc }}"
              if [ "${{ steps.filter.outputs.non-doc }}" = "true" ]; then
                echo "need_build_ut=yes" >> "$ATOMGIT_OUTPUT"
              else
                echo "need_build_ut=no" >> "$ATOMGIT_OUTPUT"
              fi

      Compatibility_Interface:
        name: Compatibility_Interface
        select: selected_by_default
        runs-on: [ self-hosted, x86, cpu=32 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/mindspore/mindspore_python3.11:v0.1
        steps:
          - name: Compatibility_Interface
            run: |
              # 以下为 CodeArts 原始执行逻辑，环境就绪后移除 if:"false" 即可恢复
              echo "API-Miner Start ..."

              # 检查基本环境
              echo "[INFO] Checking environment..."
              python --version || { echo "[ERROR] python3 required"; exit 1; }
              pip --version   || { echo "[ERROR] pip3 required"; exit 1; }

              # 工具放在工作区内部隐藏目录
              TOOL_DIR="${ATOMGIT_WORKSPACE}/.api-parser-tool"
              rm -rf ${TOOL_DIR}

              # 克隆扫描工具
              git clone -b master https://gitcode.com/Ascend/mskl.git
              git clone -b master_01 https://gitcode.com/openlibing/openlibing-api-parser.git ${TOOL_DIR}
              chmod u+x ${TOOL_DIR}/scripts/openlibing_scan.sh
              chmod u+x ${TOOL_DIR}/cli.py
              chmod u+x ${TOOL_DIR}/tools/api_analysis/linux-x86_64-ubuntu22-llvm15/api_analysis

              # 安装依赖
              pip install -r ${TOOL_DIR}/requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

              # 执行扫描
              RESULT_FILE="${TOOL_DIR}/results.json"
              SR=0
              bash ${TOOL_DIR}/scripts/openlibing_scan.sh \
                --source ${ATOMGIT_WORKSPACE} \
                --exclude .api-parser-tool \
                --output ${RESULT_FILE} \
                --upload https://apig.openlibing.com:443/openlibing-design-api-management/interface/pr-control/report \
                --upload-header "repo_url: https://gitcode.com/${{ atomgit.repository }}.git" \
                --upload-header "merge_id: ${{ env.pr_id }}" \
                --upload-header "commit_id: ${{ atomgit.sha }}" \
                --skip-install \
                || SR=$?

              # 检查结果
              if [ "$SR" -ne 0 ]; then
                  echo "API-Miner Failed!"
                  rm -rf ${TOOL_DIR}
                  exit 1
              fi

              # 清理
              rm -rf ${TOOL_DIR}
              echo "API-Miner Success ..."

  stage2:
    name: Test
    select: selected_by_default
    jobs:
      UT-pool:
        name: UT-pool
        select: selected_by_default
        if: ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [ self-hosted, mindspeed_mm, npu=4 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/mindspeed/pr-mindspeed-mm:v26.1.0-cann9.0.0-torch_npu2.7.1.post6-910b-openeuler24.03-py3.11-aarch64-ci-0824
        steps:
          - name: Checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              path: CODE
              fetch-depth: 0

          - name: run UT_pool
            run: |
              ls
              cd CODE
              set -e
              echo "start mindspeed-mm ut"
              bash ci/mm_ci_trigger.sh "${ATOMGIT_WORKSPACE}" "${{ env.pr_id }}" "${TARGET_BRANCH}" "ut"

      ST_pool:
        name: ST_pool
        select: selected_by_default
        if: ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [ self-hosted, mindspeed_mm, npu=8 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/mindspeed/pr-mindspeed-mm:v26.1.0-cann9.0.0-torch_npu2.7.1.post6-910b-openeuler24.03-py3.11-aarch64-ci-0824
        steps:
          - name: Checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              path: CODE
              fetch-depth: 0

          - name: run ST_pool
            run: |
              ls
              cd CODE
              set -e
              echo "start mindspeed-mm st"
              bash ci/mm_ci_trigger.sh "${ATOMGIT_WORKSPACE}" "${{ env.pr_id }}" "${TARGET_BRANCH}" "st"
