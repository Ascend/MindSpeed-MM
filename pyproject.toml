[project]
name = "mindspeed-mm"
version = "0.1"
requires-python = ">=3.12,<3.13"
description = "MindSpeed MM is designed to provide end-to-end large multi-modal model solutions for Huawei's Ascend chips, including models, algorithms, and downstream tasks."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  { name = "The MindSpeed MM Team" },
]
keywords = ["AI", "Ascend", "DeepLearning", "MultiModal", "MindSpeed"]
dependencies = [
    "numpy",
    "av",
    "ftfy",
    "pandas",
    "torch==2.10.0",
    "torchvision",
    "torchdata",
    "diffusers>=0.38.0",
    "transformers==4.57.0",
    "accelerate",
    "datasets",
    "qwen_vl_utils",
    "peft>=0.19.1",
    "pydantic>=2.10.4",
    "jsonargparse[all]>=4.40.0",
    "rich",
    "pyyaml",
    "einops",
    "numba"
]

[build-system]
requires = ["setuptools >= 65.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["ci*", "docs", "sources", "tests*"]

[project.optional-dependencies]
test = [
    "pytest",
    "transformers[sentencepiece]",
    "pytest-mock",
]

evaluate = [
    "portalocker==2.8.2",
    "rich==13.7.1",
    "xlsxwriter==3.2.0",
    "openpyxl==3.1.5"
]

lint = [
    "black",
]

[project.scripts]
mm-convert = "checkpoint.convert_cli:main"
